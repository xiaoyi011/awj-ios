name: build-awj-dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile awj.dylib
        run: |
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=12.0 \
            -fobjc-arc -fmodules \
            -framework Foundation -framework UIKit -framework AVFoundation \
            -dynamiclib -O2 -o awj.dylib tweak/main.m
          ls -lh awj.dylib
          file awj.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: awj-dylib
          path: awj.dylib
          if-no-files-found: error
